version: "3.8"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wenexdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wenex_net

  redis:          
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - wenex_net

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: flask run --host=0.0.0.0 --reload
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wenexdb
      - JWT_SECRET_KEY=human
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FLASK_APP=app.py
      - FLASK_ENV=development
    depends_on:
      - db
      - redis
    networks:
      - wenex_net

volumes:
  postgres_data:

networks:
  wenex_net:
    driver: bridge
